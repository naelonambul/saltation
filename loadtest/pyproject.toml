[project]
name = "saltation-loadtest"
version = "0.1.0"
description = "Open-loop transfer load tests (N-1 to N-3, N-5, N-8) for Saltation"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "oracledb>=3,<5",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12"]

[project.scripts]
saltation-loadtest = "saltation_loadtest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["saltation_loadtest"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
