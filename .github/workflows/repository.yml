# Repository gate. No path filters: every job always runs to a terminal result,
# and routing / not-applicable decisions happen inside scripts/repo.py.
name: repository

on:
  pull_request:
    # `edited` re-runs routing when the PR body's Change-ID changes.
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One live run per PR; a superseded (cancelled) run never qualifies.
  # Pushes to main are grouped per commit so every merged tree gets a full run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  # PR: judged against the PR base, identified by the PR body's Change-ID.
  # main: no active change. Branch-name inference is off in CI.
  REPO_ARGS: >-
    --ci --branch=
    ${{ github.event_name == 'pull_request' && format('--pr-body /tmp/pr-body.md --base {0} --head HEAD', github.event.pull_request.base.sha) || '' }}
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  # Runs the control-plane check directly, so its verdict does not depend on repo.py.
  control-plane-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python3 scripts/tests/run.py

  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      oracle_mode: ${{ steps.oracle-route.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff against the PR base needs history
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Write PR body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" > /tmp/pr-body.md
      - name: Select Oracle runner
        id: oracle-route
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          route_dir=$(mktemp -d)
          trap 'rm -rf "$route_dir"' EXIT
          mode=full
          if git archive "$PR_BASE_SHA" scripts/oracle_pr_route.py scripts/repo.py | tar -xf - -C "$route_dir"; then
            mode=$(python3 -Es "$route_dir/scripts/oracle_pr_route.py" --event "$GITHUB_EVENT_NAME" \
              --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA" --candidate "$GITHUB_SHA" --pr-body /tmp/pr-body.md)
          else
            echo 'Oracle routing: full. Base classifier is unavailable.'
          fi
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
      - name: Verify status with base repo.py
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          base_dir=$(mktemp -d)
          trap 'rm -rf "$base_dir"' EXIT
          git archive "$PR_BASE_SHA" scripts/repo.py | tar -xf - -C "$base_dir"
          python3 -Es "$base_dir/scripts/repo.py" status $REPO_ARGS
      - run: python3 scripts/repo.py status $REPO_ARGS

  # Fails a pull request not authored by the agent identity. An unset
  # AGENT_LOGIN passes with a notice; see docs/host-setup.md.
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          AGENT_LOGIN: ${{ vars.AGENT_LOGIN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "identity: not a pull request"
            exit 0
          fi
          if [ -z "$AGENT_LOGIN" ]; then
            echo "::notice::AGENT_LOGIN is not set; pull request author not checked"
            exit 0
          fi
          if [ "$PR_AUTHOR" != "$AGENT_LOGIN" ]; then
            echo "::error::pull request author $PR_AUTHOR is not the agent identity $AGENT_LOGIN"
            exit 1
          fi
          echo "identity: $PR_AUTHOR"

  # Check group `rust` (checks.json); each check runs in a container.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Write PR body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" > /tmp/pr-body.md
      - run: python3 scripts/repo.py verify $REPO_ARGS --full --group rust

  # Check group `web` (checks.json); each check runs in a container.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Write PR body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" > /tmp/pr-body.md
      - run: python3 scripts/repo.py verify $REPO_ARGS --full --group web

  # Check group `python` (checks.json); each check runs in a container.
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Write PR body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" > /tmp/pr-body.md
      - run: python3 scripts/repo.py verify $REPO_ARGS --full --group python

  # Allocate OCI only when the Oracle check group applies and trusted gates pass.
  oracle:
    needs: [status, identity, control-plane-tests]
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && needs.status.outputs.oracle_mode == 'docs-only' && '["ubuntu-latest"]' || '["self-hosted","linux","ARM64","saltation-oracle"]') }}
    timeout-minutes: 120
    env:
      ORACLE_MODE: ${{ github.event_name == 'pull_request' && needs.status.outputs.oracle_mode == 'docs-only' && 'docs-only' || 'full' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Write PR body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" > /tmp/pr-body.md
      - name: Confirm documentation-only decision
        if: env.ORACLE_MODE == 'docs-only'
        run: |
          set -o pipefail
          route_dir=$(mktemp -d)
          trap 'rm -rf "$route_dir"' EXIT
          git archive "$PR_BASE_SHA" scripts/oracle_pr_route.py scripts/repo.py | tar -xf - -C "$route_dir"
          mode=$(python3 -Es "$route_dir/scripts/oracle_pr_route.py" --event "$GITHUB_EVENT_NAME" \
            --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA" --candidate "$GITHUB_SHA" --pr-body /tmp/pr-body.md)
          test "$mode" = docs-only
          echo 'Oracle integration: not applicable (documentation-only)'
      - if: env.ORACLE_MODE == 'full'
        run: python3 scripts/repo.py verify $REPO_ARGS --full --group oracle

  # The one status check to require. Every job above must end in success;
  # skipped, cancelled, or failed jobs all fail the summary.
  summary:
    if: always()
    needs: [control-plane-tests, status, identity, rust, web, python, oracle]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          for job, v in needs.items():
              print(f"{job}: {v['result']}")
          sys.exit(0 if needs and all(v["result"] == "success" for v in needs.values()) else 1)
          PY
