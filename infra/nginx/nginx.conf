# Serves the customer mobile web app (static files only; the API is a separate
# origin). TLS is terminated in front of this server (Cloudflare) or not used
# (local profile).
server {
    listen 8088;
    server_name _;
    root /usr/share/nginx/html/mobile;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
