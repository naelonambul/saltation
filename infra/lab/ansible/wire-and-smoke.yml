---
- name: Start Saltation Bank systemd service connected to Oracle and MongoDB VMs
  hosts: bank
  become: true
  vars:
    saltation_secrets_file: "{{ lookup('env', 'HOME') }}/.config/saltation-lab/secrets.yml"
  tasks:
    - name: Assert required LAN IP variables are provided
      ansible.builtin.assert:
        that:
          - oracle_lan_ip is defined
          - mongo_lan_ip is defined
          - bank_lan_ip is defined
        fail_msg: "Pass -e oracle_lan_ip=... -e mongo_lan_ip=... -e bank_lan_ip=..."

    - name: Load lab secrets
      ansible.builtin.include_vars:
        file: "{{ saltation_secrets_file }}"
      no_log: true

    - name: Write bank environment file (mode 0600)
      ansible.builtin.copy:
        dest: /etc/saltation-bank.env
        owner: lab
        group: lab
        mode: "0600"
        content: |
          ORA_SDTZ=+09:00
          SALTATION_DB_USER=saltation
          SALTATION_DB_PASSWORD={{ oracle_db_password }}
          SALTATION_DB_CONNECT={{ oracle_lan_ip }}:1521/ORCLPDB1
          MONGO_HOST={{ mongo_lan_ip }}:27017
          MONGO_USER=bank
          MONGO_PASSWORD={{ mongo_bank_password }}
          MONGO_DB=bank_logs
          SALTATION_TRANSFER_DAILY_LIMIT=50000000
          SALTATION_ATM_WITHDRAW_LIMIT=1000000
          SALTATION_ATM_WITHDRAW_DAILY_LIMIT=6000000
          SALTATION_LOG_DIR=/var/log/saltation
          SALTATION_CORS_ORIGINS=http://{{ bank_lan_ip }}:8088,http://localhost:8088
          RUST_LOG=info
      no_log: true

    - name: Install saltation-bank systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/saltation-bank.service
        mode: "0644"
        content: |
          [Unit]
          Description=Saltation Banking API Server (x86_64 native)
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=lab
          Group=lab
          EnvironmentFile=/etc/saltation-bank.env
          ExecStart=/usr/local/bin/bank
          Restart=on-failure
          RestartSec=3

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd and start saltation-bank
      ansible.builtin.systemd:
        name: saltation-bank
        daemon_reload: true
        state: restarted
        enabled: true

    - name: Wait for bank public listener :8080 to be healthy
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/healthz
        status_code: 200
      register: bank_health
      retries: 20
      delay: 3
      until: bank_health.status == 200

    - name: Verify bank metrics listener :9100
      ansible.builtin.uri:
        url: http://127.0.0.1:9100/metrics
        status_code: 200

- name: Run end-to-end smoke test from saltation-gen across all 4 VMs
  hosts: generator
  become: true
  vars:
    saltation_secrets_file: "{{ lookup('env', 'HOME') }}/.config/saltation-lab/secrets.yml"
  tasks:
    - name: Load lab secrets
      ansible.builtin.include_vars:
        file: "{{ saltation_secrets_file }}"
      no_log: true

    - name: Seed 20 customers, 5 counterparties, switch clock to live, and run transfers
      ansible.builtin.shell: |
        set -euo pipefail
        export SALTATION_BANK_URL="http://{{ bank_lan_ip }}:8081"
        export MONGO_HOST="{{ mongo_lan_ip }}:27017"
        export MONGO_USER="generator"
        export MONGO_PASSWORD="${MONGO_GENERATOR_PASSWORD}"
        export MONGO_DB="truth"
        export SALTATION_GEN_SEED="20261121"
        /opt/venv/bin/saltation-gen seed --customers 20
        /opt/venv/bin/saltation-gen seed-parties --counterparties 5
        /opt/venv/bin/saltation-gen clock show
        /opt/venv/bin/saltation-gen clock live
        /opt/venv/bin/saltation-gen run-normal --minutes 0.25 --rate 2
      args:
        executable: /bin/bash
      environment:
        MONGO_GENERATOR_PASSWORD: "{{ mongo_generator_password }}"
      no_log: true

- name: Verify bank_logs and truth collections received events on saltation-mongo
  hosts: mongo
  become: true
  vars:
    saltation_secrets_file: "{{ lookup('env', 'HOME') }}/.config/saltation-lab/secrets.yml"
  tasks:
    - name: Load lab secrets
      ansible.builtin.include_vars:
        file: "{{ saltation_secrets_file }}"
      no_log: true

    - name: Count delivered bank_logs.events and truth.labels
      ansible.builtin.shell: |
        set -euo pipefail
        BL=$(mongosh --quiet -u bank -p "$MONGO_BANK_PASSWORD" --authenticationDatabase bank_logs --eval "print(db.getSiblingDB('bank_logs').events.countDocuments({}))" | tail -n 1)
        TR=$(mongosh --quiet -u generator -p "$MONGO_GENERATOR_PASSWORD" --authenticationDatabase truth --eval "print(db.getSiblingDB('truth').labels.countDocuments({}))" | tail -n 1)
        echo "bank_logs.events=$BL truth.labels=$TR"
        test "$BL" -gt 0
        test "$TR" -gt 0
      args:
        executable: /bin/bash
      environment:
        MONGO_BANK_PASSWORD: "{{ mongo_bank_password }}"
        MONGO_GENERATOR_PASSWORD: "{{ mongo_generator_password }}"
      no_log: true
      register: mongo_counts
      changed_when: false

    - name: Report E2E event and label counts
      ansible.builtin.debug:
        msg: "{{ mongo_counts.stdout }}"
