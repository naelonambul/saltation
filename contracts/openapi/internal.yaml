openapi: 3.1.0
info:
  title: Saltation internal interface (generator only)
  version: 0.1.0
  description: >
    Served on the generator listener only. Seeding, the simulated SMS outbox,
    the simulated clock and the outbox backlog are unauthenticated. Deposit
    identity lookup requires a customer session with the inquiry scope.
    Every response carries the common envelope of public.yaml. Amounts here
    are JSON integers.
servers:
  - url: http://localhost:8081
components:
  securitySchemes:
    CustomerSession:
      type: http
      scheme: bearer
  schemas:
    DepositIdentity:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [deposit_id, term_account_no, linked_account_no]
          properties:
            deposit_id: { type: string, pattern: "^[0-9]{1,12}$" }
            term_account_no: { type: string, pattern: "^[0-9]{4,16}$" }
            linked_account_no: { type: string, pattern: "^[0-9]{4,16}$" }
    Envelope:
      type: object
      required: [api_tran_id, api_tran_dtm, rsp_code, rsp_message, request_id]
      properties:
        api_tran_id: { type: string, maxLength: 40 }
        api_tran_dtm: { type: string, pattern: "^[0-9]{17}$" }
        rsp_code: { type: string, pattern: "^[A-Z][0-9]{4}$" }
        rsp_message: { type: string, maxLength: 300 }
        request_id: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
    Error:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            rsp_code: { not: { const: A0000 } }
    ClockResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [mode, business_time, rolled_through, live_started_at]
          properties:
            mode: { enum: [BACKFILL, LIVE] }
            business_time: { type: string, format: date-time }
            live_started_at:
              description: The committed LIVE transition instant in KST. Null in BACKFILL.
              anyOf: [{ type: string, format: date-time }, { type: "null" }]
            rolled_through:
              description: The last business date whose rollover finished; null before the first.
              anyOf: [{ type: string, format: date }, { type: "null" }]
    ClockSetRequest:
      description: Backfill only. Forward only, except that the clock may also move back while the bank has no customer.
      type: object
      required: [business_time]
      properties:
        business_time: { type: string, format: date-time }
    ClockAdvanceRequest:
      description: Backfill only. Rolls every business date the clock leaves before the new time is stored.
      type: object
      required: [seconds]
      properties:
        seconds: { type: integer, minimum: 1 }
    OutboxResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [undelivered, oldest_age_seconds]
          properties:
            undelivered: { type: integer, minimum: 0 }
            oldest_age_seconds: { type: [number, "null"] }
    SmsResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [phone, message, code, occurred_at]
          properties:
            phone: { type: string, maxLength: 20 }
            message: { type: string, maxLength: 200 }
            code: { type: string, pattern: "^[0-9]{6}$" }
            occurred_at: { type: string, format: date-time }
    SeedCustomersRequest:
      type: object
      required: [customers]
      properties:
        customers:
          type: array
          items:
            type: object
            required: [customer_no, name, phone, customer_type, password]
            properties:
              customer_no: { type: string, maxLength: 12 }
              name: { type: string, maxLength: 50 }
              phone: { type: string, maxLength: 20 }
              address: { type: string, maxLength: 200 }
              customer_type: { enum: [INDIVIDUAL, SOLE_PROPRIETOR] }
              password: { type: string, maxLength: 128 }
    SeedAccountsRequest:
      type: object
      required: [accounts]
      properties:
        accounts:
          type: array
          items:
            type: object
            required: [customer_no, account_no, atm_pin]
            properties:
              customer_no: { type: string, maxLength: 12 }
              account_no: { type: string, pattern: "^[0-9]{1,16}$" }
              atm_pin: { type: string, pattern: "^[0-9]{4}$" }
              opening_balance: { type: integer, minimum: 0 }
    SeedCardsRequest:
      type: object
      required: [cards]
      properties:
        cards:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [account_no, status]
            properties:
              account_no: { type: string, pattern: "^[0-9]{1,16}$" }
              status: { enum: [ACTIVE, BLOCKED] }
    SeedCardsResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [cards]
          properties:
            cards:
              type: array
              minItems: 1
              maxItems: 500
              items:
                type: object
                required: [account_no, card_no, status]
                properties:
                  account_no: { type: string, pattern: "^[0-9]{1,16}$" }
                  card_no: { type: string, pattern: "^0000[0-9]{12}$", description: Synthetic number with a Luhn check digit. }
                  status: { enum: [ACTIVE, BLOCKED] }
    SeedAccountsResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [accounts]
          properties:
            accounts:
              type: array
              items:
                type: object
                required: [account_no, fintech_use_num]
                properties:
                  account_no: { type: string }
                  fintech_use_num: { type: string, minLength: 24, maxLength: 24 }
    SeedCounterpartyClientsRequest:
      type: object
      required: [counterparty_clients]
      properties:
        counterparty_clients:
          type: array
          items:
            type: object
            required: [client_id, client_secret, institution_code, scope]
            properties:
              client_id: { type: string, pattern: "^[A-Za-z0-9_-]{1,40}$" }
              client_secret: { type: string, minLength: 16, maxLength: 128 }
              institution_code: { type: string, pattern: "^[0-9]{3}$" }
              scope: { enum: [oob, card] }
    SeedCounterpartiesRequest:
      type: object
      required: [counterparties]
      properties:
        counterparties:
          type: array
          items:
            type: object
            required: [counterparty_type, institution_code, account_no, name]
            properties:
              counterparty_type: { enum: [EMPLOYER, MERCHANT, INDIVIDUAL] }
              industry_code: { type: string, pattern: "^[A-Za-z0-9]{1,10}$" }
              institution_code: { type: string, pattern: "^[0-9]{3}$" }
              account_no: { type: string, pattern: "^[0-9]{1,16}$" }
              name: { type: string, maxLength: 50 }
    SeedAtmTerminalsRequest:
      type: object
      required: [atm_terminals]
      properties:
        atm_terminals:
          type: array
          items:
            type: object
            required: [terminal_id, region, location, latitude, longitude]
            properties:
              terminal_id: { type: string, pattern: '^[\x21-\x7E]{1,20}$' }
              region: { type: string, pattern: "^KR-(1[1-9]|[2-4][0-9]|50)$" }
              location: { type: string, maxLength: 60 }
              latitude: { type: string, pattern: '^(3[3-7](\.[0-9]{1,6})?|38(\.([0-6][0-9]{0,5}|70{0,5}))?)$', description: Decimal degrees from 33.0 through 38.7 inclusive. }
              longitude: { type: string, pattern: '^(124\.[5-9][0-9]{0,5}|12[5-9](\.[0-9]{1,6})?|13[01](\.[0-9]{1,6})?|132(\.0{1,6})?)$', description: Decimal degrees from 124.5 through 132.0 inclusive. }
    SeedAtmTerminalsResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [atm_terminals]
          properties:
            atm_terminals:
              type: array
              items:
                type: object
                required: [terminal_id]
                properties:
                  terminal_id: { type: string, maxLength: 20 }
    SeedAnalystsRequest:
      type: object
      required: [analysts]
      properties:
        analysts:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [analyst_no, name, password]
            properties:
              analyst_no: { type: string, pattern: '^[A-Za-z0-9._-]{1,40}$' }
              name: { type: string, minLength: 1, maxLength: 60 }
              password: { type: string, minLength: 8, maxLength: 128, writeOnly: true }
    CreatedResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [created]
          properties:
            created: { type: integer, minimum: 0 }
paths:
  /internal/v1/deposits/{deposit_id}/identity:
    get:
      operationId: internalDepositIdentity
      summary: Resolve the exact accounts for an owned term deposit
      description: The authenticated owner can resolve an owned term deposit in any state.
      security:
        - CustomerSession: []
      parameters:
        - name: deposit_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Exact term and linked demand account numbers
          headers:
            Cache-Control:
              required: true
              schema: { const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositIdentity" }
        "401":
          description: Missing or invalid customer session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Customer session without inquiry scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Malformed, unknown, or non-owned term deposit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Internal database error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Database unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /internal/v1/clock:
    get:
      summary: The simulated clock
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ClockResponse" } } } }
  /internal/v1/clock/set:
    post:
      summary: Set business time (backfill only)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ClockSetRequest" } } }
      responses:
        "200": { description: Set, content: { application/json: { schema: { $ref: "#/components/schemas/ClockResponse" } } } }
        "400": { description: "Not in backfill mode, or a move back that is not allowed (rsp_code A0002)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: Requests in flight did not finish within 10 seconds, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /internal/v1/clock/advance:
    post:
      summary: Advance business time (backfill only)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ClockAdvanceRequest" } } }
      responses:
        "200": { description: Advanced, content: { application/json: { schema: { $ref: "#/components/schemas/ClockResponse" } } } }
        "400": { description: Not in backfill mode (rsp_code A0002), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: Requests in flight did not finish within 10 seconds, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /internal/v1/mode/live:
    post:
      summary: Switch to live mode (one way); does nothing when already live
      responses:
        "200": { description: Live, content: { application/json: { schema: { $ref: "#/components/schemas/ClockResponse" } } } }
        "400": { description: Wall-clock time is behind business time (rsp_code A0002), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /internal/v1/outbox:
    get:
      summary: Outbox backlog, for generator backpressure
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OutboxResponse" } } } }
  /internal/v1/sms/{phone}:
    get:
      summary: The latest reset message sent to a phone
      parameters: [{ name: phone, in: path, required: true, schema: { type: string, maxLength: 20 } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SmsResponse" } } } }
        "404": { description: No message for this phone, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /internal/v1/seed/customers:
    post:
      summary: Seed customers with credentials
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SeedCustomersRequest" } } }
      responses:
        "200": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/CreatedResponse" } } } }
  /internal/v1/seed/accounts:
    post:
      summary: Seed demand deposit accounts, with an optional opening balance
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SeedAccountsRequest" } } }
      responses:
        "200": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/SeedAccountsResponse" } } } }
  /internal/v1/seed/counterparty_clients:
    post:
      summary: Seed counterparty clients (stored with a hashed secret)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SeedCounterpartyClientsRequest" } } }
      responses:
        "200": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/CreatedResponse" } } } }
  /internal/v1/seed/counterparties:
    post:
      summary: Seed external counterparty accounts
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SeedCounterpartiesRequest" } } }
      responses:
        "200": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/CreatedResponse" } } } }
  /internal/v1/seed/atm_terminals:
    post:
      summary: Seed ATM terminals
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SeedAtmTerminalsRequest" } } }
      responses:
        "200": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/SeedAtmTerminalsResponse" } } } }
  /internal/v1/seed/cards:
    post:
      summary: Seed synthetic debit cards for demand accounts, atomically and in request order
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SeedCardsRequest" } } }
      responses:
        "200": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/SeedCardsResponse" } } } }
        "400": { description: Invalid batch or account, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: Synthetic number collision retries exhausted, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { description: Internal error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: Busy, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /internal/v1/seed/analysts:
    post:
      summary: Seed a batch of analyst accounts
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SeedAnalystsRequest" } } }
      responses:
        "200": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/CreatedResponse" } } } }
        "400": { description: Invalid batch, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: Duplicate analyst, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: Temporarily unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
