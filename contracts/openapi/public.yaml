openapi: 3.1.0
info:
  title: Saltation public interface (Open Banking-shaped)
  version: 0.1.0
  description: >
    Stage-1 subset of the customer interface. Paths, field names, types and
    lengths follow KFTC Open Banking v3.3.6 where an equivalent exists; /v2.0/ext
    paths are Saltation extensions. Numeric values are JSON strings, as in KFTC.
    Every response carries the common envelope and an X-Request-Id header.
servers:
  - url: http://localhost:8080
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
  schemas:
    Envelope:
      type: object
      required: [api_tran_id, api_tran_dtm, rsp_code, rsp_message, request_id]
      properties:
        api_tran_id: { type: string, maxLength: 40 }
        api_tran_dtm: { type: string, pattern: "^[0-9]{17}$" }
        rsp_code: { type: string, pattern: "^[A-Z][0-9]{4}$" }
        rsp_message: { type: string, maxLength: 300 }
        request_id: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
    Error:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            rsp_code: { not: { const: A0000 } }
    BankPart:
      type: object
      required: [bank_tran_id, bank_tran_date, bank_code_tran, bank_rsp_code, bank_rsp_message, bank_name]
      properties:
        bank_tran_id: { type: string, pattern: "^[A-Za-z0-9]{10}[UM][A-Za-z0-9]{9}$" }
        bank_tran_date: { type: string, pattern: "^[0-9]{8}$" }
        bank_code_tran: { type: string, pattern: "^[0-9]{3}$" }
        bank_rsp_code: { type: string, pattern: "^[0-9]{3}$" }
        bank_rsp_message: { type: string, maxLength: 100 }
        bank_name: { type: string, maxLength: 20 }
    AmountString: { type: string, pattern: "^[0-9]{1,12}$" }
    SignedAmountString: { type: string, pattern: "^-?[0-9]{1,13}$" }
    LoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone: { type: string, maxLength: 20 }
        password: { type: string, maxLength: 128 }
        device_id: { type: string, maxLength: 64 }
    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [access_token, token_type, expires_in, scope, user_seq_no]
          properties:
            access_token: { type: string, minLength: 43, maxLength: 43 }
            token_type: { const: Bearer }
            expires_in: { type: integer, minimum: 1 }
            scope: { type: string }
            user_seq_no: { type: string, pattern: "^[0-9]{10}$" }
    AccountItem:
      type: object
      required: [fintech_use_num, account_alias, bank_code_std, bank_name, account_num_masked, account_holder_name, account_type]
      properties:
        fintech_use_num: { type: string, minLength: 24, maxLength: 24 }
        account_alias: { type: string, maxLength: 50 }
        bank_code_std: { type: string, pattern: "^[0-9]{3}$" }
        bank_name: { type: string, maxLength: 20 }
        account_num_masked: { type: string, maxLength: 20 }
        account_holder_name: { type: string, maxLength: 50 }
        account_type: { enum: ["1", "2", "4"] }
        inquiry_agree_yn: { enum: ["Y", "N"] }
        transfer_agree_yn: { enum: ["Y", "N"] }
        account_state: { type: string, pattern: "^[0-9]{2}$" }
    UserMeResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [user_seq_no, user_name, res_cnt, res_list]
          properties:
            user_seq_no: { type: string, pattern: "^[0-9]{10}$" }
            user_name: { type: string, maxLength: 50 }
            res_cnt: { type: string, pattern: "^[0-9]{1,5}$" }
            res_list: { type: array, items: { $ref: "#/components/schemas/AccountItem" } }
    AccountListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [user_name, res_cnt, res_list]
          properties:
            user_name: { type: string, maxLength: 50 }
            res_cnt: { type: string, pattern: "^[0-9]{1,5}$" }
            res_list: { type: array, items: { $ref: "#/components/schemas/AccountItem" } }
    BalanceResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - $ref: "#/components/schemas/BankPart"
        - type: object
          required: [fintech_use_num, balance_amt, available_amt, account_type, product_name]
          properties:
            fintech_use_num: { type: string, minLength: 24, maxLength: 24 }
            balance_amt: { $ref: "#/components/schemas/SignedAmountString" }
            available_amt: { $ref: "#/components/schemas/AmountString" }
            account_type: { enum: ["1", "2", "4"] }
            product_name: { type: string, maxLength: 100 }
            account_issue_date: { type: string, pattern: "^([0-9]{8})?$" }
            maturity_date: { type: string, pattern: "^([0-9]{8})?$" }
            last_tran_date: { type: string, pattern: "^([0-9]{8})?$" }
    TransactionItem:
      type: object
      required: [tran_date, tran_time, inout_type, tran_type, print_content, tran_amt, after_balance_amt, branch_name]
      properties:
        tran_date: { type: string, pattern: "^[0-9]{8}$" }
        tran_time: { type: string, pattern: "^[0-9]{6}$" }
        inout_type: { enum: ["입금", "출금", "지급", "기타"] }
        tran_type: { type: string, maxLength: 10 }
        print_content: { type: string, maxLength: 20 }
        tran_amt: { $ref: "#/components/schemas/AmountString" }
        after_balance_amt: { $ref: "#/components/schemas/SignedAmountString" }
        branch_name: { type: string, maxLength: 20 }
    TransactionListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - $ref: "#/components/schemas/BankPart"
        - type: object
          required: [fintech_use_num, balance_amt, page_record_cnt, next_page_yn, befor_inquiry_trace_info, res_list]
          properties:
            savings_bank_name: { type: string, maxLength: 20 }
            fintech_use_num: { type: string, minLength: 24, maxLength: 24 }
            balance_amt: { $ref: "#/components/schemas/SignedAmountString" }
            page_record_cnt: { type: string, pattern: "^[0-9]{1,2}$" }
            next_page_yn: { enum: ["Y", "N"] }
            befor_inquiry_trace_info: { type: string, maxLength: 20 }
            res_list:
              type: array
              maxItems: 25
              items: { $ref: "#/components/schemas/TransactionItem" }
paths:
  /v2.0/ext/auth/login:
    post:
      summary: Customer login (extension)
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } }
      responses:
        "200": { description: Logged in, content: { application/json: { schema: { $ref: "#/components/schemas/LoginResponse" } } } }
        "401": { description: Rejected or locked, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /oauth/2.0/revoke:
    post:
      summary: Logout (revokes the bearer token)
      security: [{ bearer: [] }]
      responses:
        "200": { description: Revoked, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }
        "401": { description: Not authenticated, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v2.0/user/me:
    get:
      summary: User info
      security: [{ bearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UserMeResponse" } } } }
  /v2.0/account/list:
    get:
      summary: Registered account list
      security: [{ bearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AccountListResponse" } } } }
  /v2.0/account/balance/fin_num:
    get:
      summary: Balance by fintech_use_num
      security: [{ bearer: [] }]
      parameters:
        - { name: bank_tran_id, in: query, required: true, schema: { type: string } }
        - { name: fintech_use_num, in: query, required: true, schema: { type: string } }
        - { name: tran_dtime, in: query, required: true, schema: { type: string, pattern: "^[0-9]{14}$" } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BalanceResponse" } } } }
        "404": { description: Not the customer's account, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v2.0/account/transaction_list/fin_num:
    get:
      summary: Transaction history by fintech_use_num (25 rows per page)
      security: [{ bearer: [] }]
      parameters:
        - { name: bank_tran_id, in: query, required: true, schema: { type: string } }
        - { name: fintech_use_num, in: query, required: true, schema: { type: string } }
        - { name: inquiry_type, in: query, required: true, schema: { enum: [A, I, O] } }
        - { name: inquiry_base, in: query, required: true, schema: { enum: [D, T] } }
        - { name: from_date, in: query, required: true, schema: { type: string, pattern: "^[0-9]{8}$" } }
        - { name: from_time, in: query, required: false, schema: { type: string, pattern: "^[0-9]{6}$" } }
        - { name: to_date, in: query, required: true, schema: { type: string, pattern: "^[0-9]{8}$" } }
        - { name: to_time, in: query, required: false, schema: { type: string, pattern: "^[0-9]{6}$" } }
        - { name: sort_order, in: query, required: true, schema: { enum: [D, A] } }
        - { name: tran_dtime, in: query, required: true, schema: { type: string, pattern: "^[0-9]{14}$" } }
        - { name: befor_inquiry_trace_info, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TransactionListResponse" } } } }
        "404": { description: Not the customer's account, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
