openapi: 3.1.0
info:
  title: Saltation public interface (Open Banking-shaped)
  version: 0.1.0
  description: >
    The customer interface through stage 2 (ledger and products). Paths, field names, types and
    lengths follow KFTC Open Banking v3.3.6 where an equivalent exists; /v2.0/ext
    paths are Saltation extensions. Numeric values are JSON strings, as in KFTC.
    Every response carries the common envelope and an X-Request-Id header.
servers:
  - url: http://localhost:8080
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
  schemas:
    Envelope:
      type: object
      required: [api_tran_id, api_tran_dtm, rsp_code, rsp_message, request_id]
      properties:
        api_tran_id: { type: string, maxLength: 40 }
        api_tran_dtm: { type: string, pattern: "^[0-9]{17}$" }
        rsp_code: { type: string, pattern: "^[A-Z][0-9]{4}$" }
        rsp_message: { type: string, maxLength: 300 }
        request_id: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
    Error:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            rsp_code: { not: { const: A0000 } }
    BankPart:
      type: object
      required: [bank_tran_id, bank_tran_date, bank_code_tran, bank_rsp_code, bank_rsp_message, bank_name]
      properties:
        bank_tran_id: { type: string, pattern: "^[A-Za-z0-9]{10}[UM][A-Za-z0-9]{9}$" }
        bank_tran_date: { type: string, pattern: "^[0-9]{8}$" }
        bank_code_tran: { type: string, pattern: "^[0-9]{3}$" }
        bank_rsp_code: { type: string, pattern: "^[0-9]{3}$" }
        bank_rsp_message: { type: string, maxLength: 100 }
        bank_name: { type: string, maxLength: 20 }
    AmountString: { type: string, pattern: "^[0-9]{1,12}$" }
    SignedAmountString: { type: string, pattern: "^-?[0-9]{1,13}$" }
    LoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone: { type: string, maxLength: 20 }
        password: { type: string, maxLength: 128 }
        device_id: { type: string, maxLength: 64 }
    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [access_token, token_type, expires_in, scope, user_seq_no]
          properties:
            access_token: { type: string, minLength: 43, maxLength: 43 }
            token_type: { const: Bearer }
            expires_in: { type: integer, minimum: 1 }
            scope: { type: string }
            user_seq_no: { type: string, pattern: "^[0-9]{10}$" }
    AccountItem:
      type: object
      required: [fintech_use_num, account_alias, bank_code_std, bank_name, account_num_masked, account_holder_name, account_type]
      properties:
        fintech_use_num: { type: string, minLength: 24, maxLength: 24 }
        account_alias: { type: string, maxLength: 50 }
        bank_code_std: { type: string, pattern: "^[0-9]{3}$" }
        bank_name: { type: string, maxLength: 20 }
        account_num_masked: { type: string, maxLength: 20 }
        account_holder_name: { type: string, maxLength: 50 }
        account_type: { enum: ["1", "2", "4"] }
        inquiry_agree_yn: { enum: ["Y", "N"] }
        transfer_agree_yn: { enum: ["Y", "N"] }
        account_state: { type: string, pattern: "^[0-9]{2}$" }
    UserMeResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [user_seq_no, user_name, res_cnt, res_list]
          properties:
            user_seq_no: { type: string, pattern: "^[0-9]{10}$" }
            user_name: { type: string, maxLength: 50 }
            res_cnt: { type: string, pattern: "^[0-9]{1,5}$" }
            res_list: { type: array, items: { $ref: "#/components/schemas/AccountItem" } }
    AccountListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [user_name, res_cnt, res_list]
          properties:
            user_name: { type: string, maxLength: 50 }
            res_cnt: { type: string, pattern: "^[0-9]{1,5}$" }
            res_list: { type: array, items: { $ref: "#/components/schemas/AccountItem" } }
    BalanceResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - $ref: "#/components/schemas/BankPart"
        - type: object
          required: [fintech_use_num, balance_amt, available_amt, account_type, product_name]
          properties:
            fintech_use_num: { type: string, minLength: 24, maxLength: 24 }
            balance_amt: { $ref: "#/components/schemas/SignedAmountString" }
            available_amt: { $ref: "#/components/schemas/AmountString" }
            account_type: { enum: ["1", "2", "4"] }
            product_name: { type: string, maxLength: 100 }
            account_issue_date: { type: string, pattern: "^([0-9]{8})?$" }
            maturity_date: { type: string, pattern: "^([0-9]{8})?$" }
            last_tran_date: { type: string, pattern: "^([0-9]{8})?$" }
    TransactionItem:
      type: object
      required: [tran_date, tran_time, inout_type, tran_type, print_content, tran_amt, after_balance_amt, branch_name]
      properties:
        tran_date: { type: string, pattern: "^[0-9]{8}$" }
        tran_time: { type: string, pattern: "^[0-9]{6}$" }
        inout_type: { enum: ["입금", "출금", "지급", "기타"] }
        tran_type: { type: string, maxLength: 10 }
        print_content: { type: string, maxLength: 20 }
        tran_amt: { $ref: "#/components/schemas/AmountString" }
        after_balance_amt: { $ref: "#/components/schemas/SignedAmountString" }
        branch_name: { type: string, maxLength: 20 }
    TransactionListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - $ref: "#/components/schemas/BankPart"
        - type: object
          required: [fintech_use_num, balance_amt, page_record_cnt, next_page_yn, befor_inquiry_trace_info, res_list]
          properties:
            savings_bank_name: { type: string, maxLength: 20 }
            fintech_use_num: { type: string, minLength: 24, maxLength: 24 }
            balance_amt: { $ref: "#/components/schemas/SignedAmountString" }
            page_record_cnt: { type: string, pattern: "^[0-9]{1,2}$" }
            next_page_yn: { enum: ["Y", "N"] }
            befor_inquiry_trace_info: { type: string, maxLength: 20 }
            res_list:
              type: array
              maxItems: 25
              items: { $ref: "#/components/schemas/TransactionItem" }
    TransferRequest:
      type: object
      required: [bank_tran_id, fintech_use_num, tran_amt, tran_dtime, transfer_purpose, recv_client_name, recv_client_bank_code, recv_client_account_num]
      properties:
        bank_tran_id: { type: string, pattern: "^[A-Za-z0-9]{10}[UM][A-Za-z0-9]{9}$" }
        fintech_use_num: { type: string, minLength: 24, maxLength: 24 }
        tran_amt: { $ref: "#/components/schemas/AmountString" }
        tran_dtime: { type: string, pattern: "^[0-9]{14}$" }
        wd_print_content: { type: string, maxLength: 14 }
        dps_print_content: { type: string, maxLength: 20 }
        transfer_purpose: { const: TR }
        recv_client_name: { type: string, maxLength: 20 }
        recv_client_bank_code: { type: string, pattern: "^[0-9]{3}$" }
        recv_client_account_num: { type: string, pattern: "^[0-9]{1,16}$" }
    TransferResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - $ref: "#/components/schemas/BankPart"
        - type: object
          required: [fintech_use_num, tran_amt, account_num_masked, print_content, wd_limit_remain_amt, dps_bank_code_std, dps_account_num_masked, dps_account_holder_name]
          properties:
            rsp_code: { const: A0000 }
            bank_rsp_code: { const: "000" }
            fintech_use_num: { type: string, minLength: 24, maxLength: 24 }
            tran_amt: { $ref: "#/components/schemas/AmountString" }
            account_num_masked: { type: string, maxLength: 20 }
            print_content: { type: string, maxLength: 14 }
            wd_limit_remain_amt: { $ref: "#/components/schemas/AmountString" }
            dps_bank_code_std: { type: string, pattern: "^[0-9]{3}$" }
            dps_bank_name: { type: string, maxLength: 20 }
            dps_account_num_masked: { type: string, maxLength: 20 }
            dps_print_content: { type: string, maxLength: 20 }
            dps_account_holder_name: { type: string, maxLength: 50 }
    TransferRejected:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - $ref: "#/components/schemas/BankPart"
        - type: object
          properties:
            rsp_code: { enum: [A0003, A0004] }
            bank_rsp_code: { enum: ["403", "404", "405", "406"] }
    BankRejected:
      description: A bank-level rejection of a product, payee or inquiry request.
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - $ref: "#/components/schemas/BankPart"
        - type: object
          properties:
            rsp_code: { enum: [A0003, A0004] }
            bank_rsp_code: { enum: ["403", "404", "405", "406", "407", "408"] }
    TransferResultResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [res_cnt, res_list]
          properties:
            res_cnt: { type: string, pattern: "^[0-9]{1,2}$" }
            res_list:
              type: array
              items:
                type: object
                required: [tran_no, bank_tran_id, bank_rsp_code]
                properties:
                  tran_no: { type: string }
                  bank_tran_id: { type: string }
                  bank_rsp_code: { type: string, pattern: "^[0-9]{3}$" }
                  tran_amt: { $ref: "#/components/schemas/AmountString" }
    BankTranId: { type: string, pattern: "^[A-Za-z0-9]{10}[UM][A-Za-z0-9]{9}$" }
    FintechUseNum: { type: string, minLength: 24, maxLength: 24 }
    NumericId: { type: string, pattern: "^[0-9]{1,12}$" }
    DateString: { type: string, pattern: "^[0-9]{8}$" }
    OptionalDateString: { type: string, pattern: "^([0-9]{8})?$" }
    DateTimeString: { type: string, pattern: "^[0-9]{14}$" }
    PasswordResetRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, maxLength: 20 }
    PasswordResetConfirm:
      type: object
      required: [phone, code, new_password]
      properties:
        phone: { type: string, maxLength: 20 }
        code: { type: string, pattern: "^[0-9]{6}$" }
        new_password: { type: string, minLength: 8, maxLength: 128 }
    InquiryReceiveRequest:
      type: object
      required: [bank_tran_id, bank_code_std, account_num, tran_amt, tran_dtime]
      properties:
        bank_tran_id: { $ref: "#/components/schemas/BankTranId" }
        bank_code_std: { type: string, pattern: "^[0-9]{3}$" }
        account_num: { type: string, pattern: "^[0-9]{1,16}$" }
        tran_amt: { $ref: "#/components/schemas/AmountString" }
        tran_dtime: { $ref: "#/components/schemas/DateTimeString" }
        print_content: { type: string, maxLength: 20 }
    InquiryReceiveResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - $ref: "#/components/schemas/BankPart"
        - type: object
          required: [bank_code_std, account_num_masked, account_holder_name, tran_amt]
          properties:
            rsp_code: { const: A0000 }
            bank_rsp_code: { const: "000" }
            bank_code_std: { type: string, pattern: "^[0-9]{3}$" }
            account_num_masked: { type: string, maxLength: 20 }
            account_holder_name: { type: string, maxLength: 50 }
            tran_amt: { $ref: "#/components/schemas/AmountString" }
    Payee:
      type: object
      required: [payee_id, bank_code_std, bank_name, account_num, account_holder_name, alias, registered_dtime]
      properties:
        payee_id: { $ref: "#/components/schemas/NumericId" }
        bank_code_std: { type: string, pattern: "^[0-9]{3}$" }
        bank_name: { type: string, maxLength: 20 }
        account_num: { type: string, pattern: "^[0-9]{1,16}$" }
        account_holder_name: { type: string, maxLength: 50 }
        alias: { type: string, maxLength: 40 }
        registered_dtime: { $ref: "#/components/schemas/DateTimeString" }
    PayeeCreateRequest:
      description: The bank resolves the holder name from the account; an unknown account is rejected.
      type: object
      required: [bank_code_std, account_num]
      properties:
        bank_code_std: { type: string, pattern: "^[0-9]{3}$" }
        account_num: { type: string, pattern: "^[0-9]{1,16}$" }
        alias: { type: string, maxLength: 40 }
    PayeeResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - $ref: "#/components/schemas/Payee"
    PayeeListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [res_cnt, res_list]
          properties:
            res_cnt: { type: string, pattern: "^[0-9]{1,5}$" }
            res_list: { type: array, items: { $ref: "#/components/schemas/Payee" } }
    ProductTerms:
      type: object
      required: [terms_id, term_months, min_amt, max_amt, early_close_yn]
      properties:
        terms_id: { $ref: "#/components/schemas/NumericId" }
        term_months: { type: string, pattern: "^([0-9]{1,4})?$", description: Empty for a product without a term. }
        min_amt: { $ref: "#/components/schemas/AmountString" }
        max_amt: { $ref: "#/components/schemas/AmountString" }
        early_close_yn: { enum: ["Y", "N"] }
    ProductItem:
      type: object
      required: [product_id, product_type, product_name, terms_list]
      properties:
        product_id: { $ref: "#/components/schemas/NumericId" }
        product_type: { enum: [DEMAND, TERM, LOAN] }
        product_name: { type: string, maxLength: 100 }
        terms_list: { type: array, items: { $ref: "#/components/schemas/ProductTerms" } }
    ProductListResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [res_cnt, res_list]
          properties:
            res_cnt: { type: string, pattern: "^[0-9]{1,5}$" }
            res_list: { type: array, items: { $ref: "#/components/schemas/ProductItem" } }
    ProductOpenRequest:
      description: >
        Opens a term deposit or takes a loan. fintech_use_num is the customer's
        demand deposit account that pays the principal (deposit) or receives it (loan).
      type: object
      required: [bank_tran_id, fintech_use_num, terms_id, tran_amt, tran_dtime]
      properties:
        bank_tran_id: { $ref: "#/components/schemas/BankTranId" }
        fintech_use_num: { $ref: "#/components/schemas/FintechUseNum" }
        terms_id: { $ref: "#/components/schemas/NumericId" }
        tran_amt: { $ref: "#/components/schemas/AmountString" }
        tran_dtime: { $ref: "#/components/schemas/DateTimeString" }
    DepositCloseRequest:
      type: object
      required: [bank_tran_id, tran_dtime]
      properties:
        bank_tran_id: { $ref: "#/components/schemas/BankTranId" }
        tran_dtime: { $ref: "#/components/schemas/DateTimeString" }
    LoanRepayRequest:
      type: object
      required: [bank_tran_id, tran_amt, tran_dtime]
      properties:
        bank_tran_id: { $ref: "#/components/schemas/BankTranId" }
        tran_amt: { $ref: "#/components/schemas/AmountString" }
        tran_dtime: { $ref: "#/components/schemas/DateTimeString" }
    DepositDetail:
      type: object
      required: [deposit_id, fintech_use_num, account_num_masked, product_name, principal_amt, balance_amt, account_issue_date, maturity_date, account_state, linked_fintech_use_num, close_type, close_date]
      properties:
        deposit_id: { $ref: "#/components/schemas/NumericId" }
        fintech_use_num: { $ref: "#/components/schemas/FintechUseNum" }
        account_num_masked: { type: string, maxLength: 20 }
        product_name: { type: string, maxLength: 100 }
        principal_amt: { $ref: "#/components/schemas/AmountString" }
        balance_amt: { $ref: "#/components/schemas/AmountString" }
        account_issue_date: { $ref: "#/components/schemas/DateString" }
        maturity_date: { $ref: "#/components/schemas/DateString" }
        account_state: { type: string, pattern: "^[0-9]{2}$" }
        linked_fintech_use_num: { $ref: "#/components/schemas/FintechUseNum" }
        close_type: { enum: ["", EARLY, MATURITY] }
        close_date: { $ref: "#/components/schemas/OptionalDateString" }
    DepositResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - $ref: "#/components/schemas/DepositDetail"
    DepositTranResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - $ref: "#/components/schemas/BankPart"
        - $ref: "#/components/schemas/DepositDetail"
        - type: object
          properties:
            rsp_code: { const: A0000 }
            bank_rsp_code: { const: "000" }
    LoanDetail:
      type: object
      required: [loan_id, fintech_use_num, account_num_masked, product_name, principal_amt, balance_amt, account_issue_date, maturity_date, account_state, linked_fintech_use_num]
      properties:
        loan_id: { $ref: "#/components/schemas/NumericId" }
        fintech_use_num: { $ref: "#/components/schemas/FintechUseNum" }
        account_num_masked: { type: string, maxLength: 20 }
        product_name: { type: string, maxLength: 100 }
        principal_amt: { $ref: "#/components/schemas/AmountString" }
        balance_amt: { $ref: "#/components/schemas/AmountString", description: Amount still owed. }
        account_issue_date: { $ref: "#/components/schemas/DateString" }
        maturity_date: { $ref: "#/components/schemas/DateString" }
        account_state: { type: string, pattern: "^[0-9]{2}$" }
        linked_fintech_use_num: { $ref: "#/components/schemas/FintechUseNum" }
    LoanResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - $ref: "#/components/schemas/LoanDetail"
    LoanTranResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - $ref: "#/components/schemas/BankPart"
        - $ref: "#/components/schemas/LoanDetail"
        - type: object
          properties:
            rsp_code: { const: A0000 }
            bank_rsp_code: { const: "000" }
paths:
  /v2.0/ext/auth/login:
    post:
      summary: Customer login (extension)
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } }
      responses:
        "200": { description: Logged in, content: { application/json: { schema: { $ref: "#/components/schemas/LoginResponse" } } } }
        "401": { description: Rejected or locked, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /oauth/2.0/revoke:
    post:
      summary: Logout (revokes the bearer token)
      security: [{ bearer: [] }]
      responses:
        "200": { description: Revoked, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }
        "401": { description: Not authenticated, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v2.0/user/me:
    get:
      summary: User info
      security: [{ bearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UserMeResponse" } } } }
  /v2.0/account/list:
    get:
      summary: Registered account list
      security: [{ bearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AccountListResponse" } } } }
  /v2.0/account/balance/fin_num:
    get:
      summary: Balance by fintech_use_num
      security: [{ bearer: [] }]
      parameters:
        - { name: bank_tran_id, in: query, required: true, schema: { type: string } }
        - { name: fintech_use_num, in: query, required: true, schema: { type: string } }
        - { name: tran_dtime, in: query, required: true, schema: { type: string, pattern: "^[0-9]{14}$" } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BalanceResponse" } } } }
        "404": { description: Not the customer's account, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v2.0/account/transaction_list/fin_num:
    get:
      summary: Transaction history by fintech_use_num (25 rows per page)
      security: [{ bearer: [] }]
      parameters:
        - { name: bank_tran_id, in: query, required: true, schema: { type: string } }
        - { name: fintech_use_num, in: query, required: true, schema: { type: string } }
        - { name: inquiry_type, in: query, required: true, schema: { enum: [A, I, O] } }
        - { name: inquiry_base, in: query, required: true, schema: { enum: [D, T] } }
        - { name: from_date, in: query, required: true, schema: { type: string, pattern: "^[0-9]{8}$" } }
        - { name: from_time, in: query, required: false, schema: { type: string, pattern: "^[0-9]{6}$" } }
        - { name: to_date, in: query, required: true, schema: { type: string, pattern: "^[0-9]{8}$" } }
        - { name: to_time, in: query, required: false, schema: { type: string, pattern: "^[0-9]{6}$" } }
        - { name: sort_order, in: query, required: true, schema: { enum: [D, A] } }
        - { name: tran_dtime, in: query, required: true, schema: { type: string, pattern: "^[0-9]{14}$" } }
        - { name: befor_inquiry_trace_info, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TransactionListResponse" } } } }
        "404": { description: Not the customer's account, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v2.0/transfer/withdraw/fin_num:
    post:
      summary: Transfer to an in-bank account or a simulated external counterparty account; completes to the recipient in one call
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TransferRequest" } } }
      responses:
        "200": { description: Transferred, or a replay of the same bank_tran_id and payload, content: { application/json: { schema: { $ref: "#/components/schemas/TransferResponse" } } } }
        "409": { description: Same bank_tran_id with a different payload, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: Rejected by the bank (bank_rsp_code 403, 404, 405, 406), content: { application/json: { schema: { $ref: "#/components/schemas/TransferRejected" } } } }
        "503": { description: Busy (lock wait or outbox capacity); retry with the same bank_tran_id, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v2.0/transfer/result:
    post:
      summary: Results of earlier transfers by bank_tran_id
      security: [{ bearer: [] }]
      responses:
