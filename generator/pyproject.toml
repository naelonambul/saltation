[project]
name = "saltation-gen"
version = "0.1.0"
description = "Persona-driven synthetic activity for the Saltation bank"
requires-python = ">=3.13"
dependencies = ["httpx>=0.28", "pymongo>=4.13"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12", "import-linter>=2.3"]

[project.scripts]
saltation-gen = "saltation_gen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["saltation_gen"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

# Generator boundaries (spec: Generator layout and Dependency direction):
# cli -> drivers -> personas -> (client | truth | config); nothing imports upward,
# and the bank client never touches the truth store.
[tool.importlinter]
root_package = "saltation_gen"

[[tool.importlinter.contracts]]
name = "Generator layers"
type = "layers"
layers = [
    "saltation_gen.cli",
    "saltation_gen.drivers",
    "saltation_gen.personas",
    "saltation_gen.client | saltation_gen.truth | saltation_gen.config",
]

[[tool.importlinter.contracts]]
name = "The bank client and the truth store are independent"
type = "independence"
modules = ["saltation_gen.client", "saltation_gen.truth"]
